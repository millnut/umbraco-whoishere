name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet/login request a GitHub OIDC token for trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The backoffice shows this version under Settings > Packages, so keep it in step with the NuGet version
      - name: Set package version
        working-directory: src/Umbraco.Community.WhoIsHere/Client/public
        run: jq --arg version "${{github.ref_name}}" '.version = $version' umbraco-package.json > umbraco-package.tmp && mv umbraco-package.tmp umbraco-package.json

      # Rebuild the backoffice client so the package never ships a stale copy of wwwroot
      - name: Build client
        working-directory: src/Umbraco.Community.WhoIsHere/Client
        run: |
          npm ci
          npm run build

      - name: Test
        run: dotnet test --project src/Umbraco.Community.WhoIsHere.Tests

      - name: Build & Pack
        run: dotnet pack src/Umbraco.Community.WhoIsHere/Umbraco.Community.WhoIsHere.csproj -c Release /p:Version=${{github.ref_name}}

      # Swaps the GitHub OIDC token for a short-lived nuget.org API key (trusted publishing)
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USER}}

      - name: Push to NuGet
        run: dotnet nuget push **/*.nupkg -k ${{steps.login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
