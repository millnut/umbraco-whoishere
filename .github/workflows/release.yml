name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rebuild the backoffice client so the package never ships a stale copy of wwwroot
      - name: Build client
        working-directory: src/Umbraco.Community.WhoIsHere/Client
        run: |
          npm ci
          npm run build

      - name: Test
        run: dotnet test --project src/Umbraco.Community.WhoIsHere.Tests

      - name: Build & Pack
        run: dotnet pack src/Umbraco.Community.WhoIsHere/Umbraco.Community.WhoIsHere.csproj -c Release /p:Version=${{github.ref_name}}

      - name: Push to NuGet
        run: dotnet nuget push **/*.nupkg -k ${{secrets.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
